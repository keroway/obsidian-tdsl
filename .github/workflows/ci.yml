name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # pnpm audit が参照する npm アドバイザリDBは依存ファイルを変更しなくても
    # 更新される。osv-scan.yml と同じ理由で、audit ジョブだけ週次実行する。
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      test: ${{ steps.filter.outputs.test }}
      lint: ${{ steps.filter.outputs.lint }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
      build: ${{ steps.filter.outputs.build }}
      audit: ${{ steps.filter.outputs.audit }}
      typos: ${{ steps.filter.outputs.typos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Keep required check names stable while avoiding Node setup and dependency
      # installation when a job cannot be affected by the changed paths.
      - id: filter
        name: Classify changed files
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # 週次 schedule は pnpm audit を再実行するためだけに存在する（osv-scan.yml と
          # 同じ理由）。他のジョブは依存ファイルの変更が無い schedule 実行では何も得ないため
          # audit だけを有効化する。
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            {
              echo "test=false"
              echo "lint=false"
              echo "typecheck=false"
              echo "build=false"
              echo "audit=true"
              echo "typos=false"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${BASE_SHA}"
          else
            base="${BEFORE}"
          fi

          # A first push has no usable predecessor. Run every verification rather
          # than risk overlooking a change.
          if [[ -z "${base}" || "${base}" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="__all__"
          else
            changed_files="$(git diff --name-only "${base}" "${HEAD_SHA}")"
          fi

          # 分類ルールは scripts/classify-changes.sh（検証は src/classify-changes.test.ts）。
          # 未分類のパスは全ジョブを起動する。
          bash scripts/classify-changes.sh <<< "${changed_files}" >> "${GITHUB_OUTPUT}"

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # カバレッジ閾値は vitest.config.ts に設定されているが、CI から
      # test:coverage を呼ぶ場所が無く、実行されないゲートになっていた（#188）。
      # `test:coverage` は `test` と同じテストを走らせた上で閾値を判定するため、
      # ここを置き換えるだけでテストの実行範囲は変わらない。
      - name: Test (with coverage thresholds)
        run: pnpm run test:coverage

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # biome check は format + lint に加えて assist.actions.source.organizeImports
      # (import 順序)も検証する。format:check / lint を個別に呼ぶと
      # organizeImports 違反を CI が素通りしてしまう（#280）。
      - name: Check (format + lint + organizeImports)
        run: pnpm exec biome check --error-on-warnings .

  typecheck:
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify main.js exists
        run: test -f main.js && echo "main.js generated successfully"

  audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level high

  typos:
    needs: changes
    if: needs.changes.outputs.typos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check spelling
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
