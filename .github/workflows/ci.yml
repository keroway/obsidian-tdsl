name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.filter.outputs.test }}
      lint: ${{ steps.filter.outputs.lint }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
      build: ${{ steps.filter.outputs.build }}
      audit: ${{ steps.filter.outputs.audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Keep required check names stable while avoiding Node setup and dependency
      # installation when a job cannot be affected by the changed paths.
      - id: filter
        name: Classify changed files
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${BASE_SHA}"
          else
            base="${BEFORE}"
          fi

          # A first push has no usable predecessor. Run every verification rather
          # than risk overlooking a change.
          if [[ -z "${base}" || "${base}" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="__all__"
          else
            changed_files="$(git diff --name-only "${base}" "${HEAD_SHA}")"
          fi

          test=false
          lint=false
          typecheck=false
          build=false
          audit=false

          while IFS= read -r file; do
            case "${file}" in
              __all__|.github/workflows/ci.yml|mise.toml)
                test=true; lint=true; typecheck=true; build=true; audit=true ;;
              src/**)
                test=true; lint=true; typecheck=true; build=true ;;
              esbuild.config.mjs)
                lint=true; build=true ;;
              vitest.config.ts)
                test=true; lint=true; typecheck=true ;;
              tsconfig.json)
                lint=true; typecheck=true ;;
              biome.json|version-bump.mjs|styles.css|manifest.json|versions.json)
                lint=true ;;
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                test=true; lint=true; typecheck=true; build=true; audit=true ;;
            esac
          done <<< "${changed_files}"

          {
            echo "test=${test}"
            echo "lint=${lint}"
            echo "typecheck=${typecheck}"
            echo "build=${build}"
            echo "audit=${audit}"
          } >> "${GITHUB_OUTPUT}"

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # カバレッジ閾値は vitest.config.ts に設定されているが、CI から
      # test:coverage を呼ぶ場所が無く、実行されないゲートになっていた（#188）。
      # `test:coverage` は `test` と同じテストを走らせた上で閾値を判定するため、
      # ここを置き換えるだけでテストの実行範囲は変わらない。
      - name: Test (with coverage thresholds)
        run: pnpm run test:coverage

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

  typecheck:
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify main.js exists
        run: test -f main.js && echo "main.js generated successfully"

  audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level high
