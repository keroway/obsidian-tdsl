# 各リポジトリの .github/workflows/osv-scan.yml に配置する呼び出し元。
name: osv-scan

on:
  # Dependency vulnerability results only change when dependency metadata or the
  # scanner configuration changes; the weekly scan still catches newly disclosed CVEs.
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/osv-scan.yml"
  # main の branch protection に required status check として登録するため、
  # PR でも実行する。トリガーが無いと required check が常に pending のまま残ってしまう。
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: keroway/.github/.github/workflows/reusable-osv-scan.yml@main # zizmor: ignore[unpinned-uses] — 同一アカウント内の自前 reusable workflow。SHA ピン化は Phase 2 で検討
