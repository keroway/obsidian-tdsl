name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # push:tags のみでトリガーされ、PR 経由の未信頼コードは実行されないため誤検知。
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning] v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version consistency
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          manifest_version="$(jq -r '.version' manifest.json)"
          package_version="$(jq -r '.version' package.json)"
          versions_last_key="$(jq -r 'keys_unsorted[-1]' versions.json)"

          fail=0
          if [ "$TAG_NAME" != "$manifest_version" ]; then
            echo "::error::tag ($TAG_NAME) does not match manifest.json version ($manifest_version)"
            fail=1
          fi
          if [ "$TAG_NAME" != "$package_version" ]; then
            echo "::error::tag ($TAG_NAME) does not match package.json version ($package_version)"
            fail=1
          fi
          if [ "$TAG_NAME" != "$versions_last_key" ]; then
            echo "::error::tag ($TAG_NAME) does not match versions.json last key ($versions_last_key)"
            fail=1
          fi

          if ! grep -qF "## [$TAG_NAME]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no heading for version $TAG_NAME"
            fail=1
          fi

          exit "$fail"

      - name: Build
        run: pnpm run build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" main.js manifest.json styles.css \
            --title "$TAG_NAME" \
            --generate-notes
