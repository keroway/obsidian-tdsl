# 各リポジトリの .github/workflows/workflow-lint.yml に配置する呼び出し元。
name: workflow-lint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "**/*.sh"
  # PR は無条件で実行する。branch protection の required status check に
  # 登録するため、paths フィルタ付きだと対象外の PR でワークフロー自体が
  # 起動せず required check が常に pending のまま残ってしまう。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # SHA は keroway/.github の main（2026-09-07 時点でレビュー済み）に固定。更新手順は
    # docs/reusable-workflow-sha-pinning.md を参照。
    uses: keroway/.github/.github/workflows/reusable-workflow-lint.yml@2c7eddb9c4039a291aa3237b675d5a0fc001b85e
