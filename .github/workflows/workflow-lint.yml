# 各リポジトリの .github/workflows/workflow-lint.yml に配置する呼び出し元。
name: workflow-lint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "**/*.sh"
  # PR は無条件で実行する。branch protection の required status check に
  # 登録するため、paths フィルタ付きだと対象外の PR でワークフロー自体が
  # 起動せず required check が常に pending のまま残ってしまう。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: keroway/.github/.github/workflows/reusable-workflow-lint.yml@main # zizmor: ignore[unpinned-uses] — 同一アカウント内の自前 reusable workflow。SHA ピン化は Phase 2 で検討
